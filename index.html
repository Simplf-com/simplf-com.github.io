<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simplf — Coming Soon</title>
  <meta name="description" content="Simplf is under construction. Coming soon.">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --fg: #f2f2f2;
        --muted: #9a9a9a;
        --accent: #6a9bff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .tag {
      display: inline-block;
      margin-bottom: 1.5rem;
      padding: 0.3rem 0.8rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">Under construction</span>
    <h1>Simplf</h1>
    <p>Something new is on the way. Coming soon.</p>
  </main>
</body>
</html>
